# FancyScrollView Unity Windows ビルド 再利用可能ワークフロー
# このワークフローは build-samples.yml と release.yml から共通ビルドロジックを抽出したものです
# 参考: https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Unity Windows Build (Reusable)

on:
  workflow_call:
    inputs:
      build_name:
        description: 'ビルド名（実行ファイル名）'
        required: false
        type: string
        default: 'FancyScrollView'
      builds_path:
        description: 'ビルド出力先パス'
        required: false
        type: string
        default: 'Builds/Player'
      cache_key_prefix:
        description: 'Unity Libraryキャッシュのキープレフィックス'
        required: false
        type: string
        default: 'Library-FancyScrollView'
      versioning:
        description: 'Unity Builder versioning strategy (None, Semantic, Tag, Custom)'
        required: false
        type: string
        default: 'None'
      upload_artifact:
        description: 'ビルド成果物をアーティファクトとしてアップロードするか'
        required: false
        type: boolean
        default: false
      artifact_name:
        description: 'アップロードするアーティファクトの名前'
        required: false
        type: string
        default: 'FancyScrollView-Windows'
      artifact_retention_days:
        description: 'アーティファクトの保持日数'
        required: false
        type: number
        default: 7
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  build:
    name: Unity Windows Build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read # リポジトリのコードを読み取るために必要

    steps:
      # リポジトリのコードを取得します
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Unity Libraryフォルダをキャッシュして、ビルド時間を短縮します
      # キャッシュがヒットすると、ビルド時間が大幅に短縮されます（15-25分 → 5-10分）
      - name: Cache Unity Library
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: Library
          key: ${{ inputs.cache_key_prefix }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ${{ inputs.cache_key_prefix }}-StandaloneWindows64-
            ${{ inputs.cache_key_prefix }}-

      # Unityプロジェクトをビルドします
      # GameCI Unity Builderを使用してWindows向けにビルド
      - name: Build Unity Project
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64 # Windows 64bit向けビルド
          unityVersion: auto # ProjectVersion.txtから自動でバージョンを取得
          buildName: ${{ inputs.build_name }}
          buildsPath: ${{ inputs.builds_path }}
          versioning: ${{ inputs.versioning }}

      # ビルドが成功したか確認します
      - name: Verify Build Output
        run: |
          if (!(Test-Path "${{ inputs.builds_path }}/StandaloneWindows64/${{ inputs.build_name }}.exe")) {
            Write-Host "❌ ビルド失敗: 実行ファイルが見つかりません"
            exit 1
          }
          Write-Host "✅ ビルド成功: 実行ファイルを確認しました"

      # ビルドサイズを表示します
      - name: Report Build Size
        run: |
          Write-Host "📊 ビルドサイズ:"
          $size = (Get-ChildItem -Path "${{ inputs.builds_path }}/StandaloneWindows64" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("{0:N2} MB" -f $size)
          Write-Host ""
          Write-Host "📁 実行ファイルサイズ:"
          $exeSize = (Get-Item "${{ inputs.builds_path }}/StandaloneWindows64/${{ inputs.build_name }}.exe").Length / 1MB
          Write-Host ("{0:N2} MB" -f $exeSize)

      # ビルド成果物をGitHub Actionsにアップロードします（オプション）
      - name: Upload Build Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.builds_path }}/StandaloneWindows64
          retention-days: ${{ inputs.artifact_retention_days }}
