# FancyScrollView サンプルビルドワークフロー
# このワークフローはPRとdevelopブランチへのプッシュ時にサンプルシーンをビルドします
# 目的: ビルドが壊れていないことを検証

name: Build Sample Scenes

# ワークフローのトリガー設定
on:
  # developブランチへのプルリクエスト時に実行
  pull_request:
    branches:
      - develop
  # developブランチへのプッシュ時に実行
  push:
    branches:
      - develop
  # 手動実行を許可（テスト目的）
  workflow_dispatch:

# 並列実行の制御：同じブランチで複数のビルドが走った場合、古いビルドをキャンセル
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# セキュリティ: デフォルトで全ての権限を無効化
permissions: {}

jobs:
  build:
    name: Unity Windows Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # このジョブに必要な最小限の権限のみを付与
    permissions:
      contents: read # リポジトリのコードを読み取るために必要

    steps:
      # リポジトリのコードを取得します
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Unity Libraryフォルダをキャッシュして、ビルド時間を短縮します
      # キャッシュがヒットすると、ビルド時間が大幅に短縮されます（15-25分 → 5-10分）
      - name: Cache Unity Library
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: Library
          key: Library-FancyScrollView-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-FancyScrollView-StandaloneWindows64-
            Library-FancyScrollView-

      # Unityプロジェクトをビルドします
      # GameCI Unity Builderを使用してWindows向けにビルド
      - name: Build Unity Project
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64 # Windows 64bit向けビルド
          unityVersion: auto # ProjectVersion.txtから自動でバージョンを取得
          buildName: FancyScrollView
          buildsPath: Builds/Player

      # ビルドが成功したか確認します
      - name: Verify Build Output
        run: |
          if [ ! -f "Builds/Player/StandaloneWindows64/FancyScrollView.exe" ]; then
            echo "❌ ビルド失敗: 実行ファイルが見つかりません"
            exit 1
          fi
          echo "✅ ビルド成功: 実行ファイルを確認しました"

      # ビルドサイズを表示します
      - name: Report Build Size
        run: |
          echo "📊 ビルドサイズ:"
          du -sh Builds/Player/StandaloneWindows64/
          echo ""
          echo "📁 実行ファイルサイズ:"
          ls -lh Builds/Player/StandaloneWindows64/FancyScrollView.exe

      # ビルド成果物をGitHub Actionsにアップロードします
      # アップロードされたファイルは、GitHubのActionsタブからダウンロード可能です（7日間保持）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FancyScrollView-Windows-${{ github.sha }}
          path: Builds/Player/StandaloneWindows64
          retention-days: 7
