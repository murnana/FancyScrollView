# FancyScrollView サンプルビルドワークフロー
# このワークフローはPRとdevelopブランチへのプッシュ時にサンプルシーンをビルドします
# 目的: ビルドが壊れていないことを検証

name: Build Sample Scenes

# ワークフローのトリガー設定
on:
  # developブランチへのプルリクエスト時に実行
  pull_request:
    branches:
      - develop
  # developブランチへのプッシュ時に実行
  push:
    branches:
      - develop
  # 手動実行を許可（テスト目的）
  workflow_dispatch:

# 並列実行の制御：同じブランチで複数のビルドが走った場合、古いビルドをキャンセル
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# セキュリティ: デフォルトで全ての権限を無効化
permissions: {}

jobs:
  # 再利用可能ワークフローを呼び出してビルドを実行
  build:
    name: Build Unity Project
    uses: ./.github/workflows/unity-build-windows.yml
    permissions:
      contents: read # リポジトリのコードを読み取るために必要
    with:
      build_name: FancyScrollView
      builds_path: Builds/Player
      cache_key_prefix: Library-FancyScrollView
      versioning: None
      upload_artifact: true
      artifact_name: FancyScrollView-Windows-${{ github.sha }}
      artifact_retention_days: 7
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
